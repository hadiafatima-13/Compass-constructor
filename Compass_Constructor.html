<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compass Constructor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg1:#052e16;--bg2:#14532d;--card:#fff;--ink:#1e1b2e;--accent:#22c55e;--good:#16a34a;--bad:#dc2626;--muted:#6b7280;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card:#1f2937;--ink:#f3f4f6;--muted:#9ca3af;}}
:root[data-theme="dark"]{--card:#1f2937;--ink:#f3f4f6;--muted:#9ca3af;}
*{box-sizing:border-box;}
#bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block;}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center;padding-left:12px;padding-right:12px;}
.wrap{width:100%;max-width:720px;padding:20px 0 40px;position:relative;z-index:1;}
h1{color:#fff;text-align:center;margin-bottom:2px;}
.sub{color:#bbf7d0;text-align:center;margin-bottom:14px;font-size:.9rem;}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.tab{padding:8px 16px;border-radius:20px;border:2px solid #fff3;background:transparent;color:#fff;font-weight:700;cursor:pointer;}
.tab.active{background:var(--accent);border-color:var(--accent);}
.card{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.stats{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px;font-size:.9rem;}
#stage{width:100%;height:170px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#f0fdf4,#dcfce7);display:block;margin-bottom:8px;touch-action:none;cursor:grab;}
.hint{text-align:center;font-size:.72rem;color:var(--muted);margin:-4px 0 8px;}
.task{font-weight:700;margin-bottom:10px;}
.pool,.seq{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.step{padding:10px 12px;border:2px solid #d1d5db;border-radius:10px;cursor:pointer;font-size:.92rem;}
.step:hover{border-color:var(--accent);}
.step.picked{opacity:.35;pointer-events:none;}
.seqItem{padding:8px 12px;border-radius:10px;background:#f0fdf4;color:#14532d;border:2px solid var(--accent);font-size:.9rem;}
.label{font-size:.8rem;color:var(--muted);font-weight:700;margin:10px 0 4px;text-transform:uppercase;}
.btnRow{display:flex;gap:10px;margin-top:10px;}
button.act{padding:10px 16px;border-radius:10px;border:none;font-weight:700;cursor:pointer;}
.check{background:var(--accent);color:#fff;}
.reset{background:#e5e7eb;color:#111;}
.feedback{min-height:24px;margin-top:8px;font-weight:600;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
button.opt{padding:12px;border-radius:10px;border:2px solid #d1d5db;background:transparent;color:var(--ink);cursor:pointer;font-size:1rem;}
button.opt.correct{background:var(--good);border-color:var(--good);color:#fff;}
button.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff;}
.next{display:none;margin-top:12px;padding:10px 18px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;}
.done{text-align:center;padding:16px;}
.restart{margin-top:10px;padding:10px 20px;border-radius:10px;border:none;background:#3b82f6;color:#fff;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
<h1>🧭 Compass Constructor</h1>
<div class="sub">Order the construction steps correctly, then hunt for unknown angles</div>
<div class="tabs">
  <button class="tab active" id="tabSteps">Construction Steps</button>
  <button class="tab" id="tabAngles">Angle Sum Detective</button>
</div>
<div class="card" id="card">
  <canvas id="stage"></canvas>
  <div class="hint" id="hint">Drag to spin the 3D model</div>
  <div id="below"></div>
</div>
</div>
<script>

// ---------- animated 3D background ----------
(function(){
  const canvas=document.getElementById('bgCanvas');
  if(!canvas || typeof THREE==='undefined') return;
  const bgRenderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  bgRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  bgRenderer.setSize(window.innerWidth,window.innerHeight);
  const bgScene=new THREE.Scene();
  const bgCam=new THREE.PerspectiveCamera(55,window.innerWidth/window.innerHeight,0.1,100);
  bgCam.position.set(0,0,9);
  const bl=new THREE.DirectionalLight(0xffffff,1.1); bl.position.set(5,6,7); bgScene.add(bl);
  bgScene.add(new THREE.AmbientLight(0xffffff,0.55));
  const colors=[0x22c55e,0x16a34a];
  const geos=[
    new THREE.IcosahedronGeometry(1,0),
    new THREE.TorusGeometry(0.7,0.24,10,26),
    new THREE.OctahedronGeometry(1,0),
    new THREE.TetrahedronGeometry(1.05,0),
    new THREE.TorusKnotGeometry(0.55,0.16,64,8)
  ];
  const shapes=[];
  const count = window.innerWidth<520? 7 : 12;
  for(let i=0;i<count;i++){
    const geo=geos[i%geos.length];
    const wire=i%2===0;
    const mat=new THREE.MeshStandardMaterial({color:colors[i%colors.length],wireframe:wire,transparent:true,opacity:wire?0.35:0.16,roughness:0.55,metalness:0.1});
    const mesh=new THREE.Mesh(geo,mat);
    const scl=0.5+Math.random()*0.9;
    mesh.scale.set(scl,scl,scl);
    mesh.position.set((Math.random()-0.5)*16,(Math.random()-0.5)*16,(Math.random()-0.5)*10-3);
    mesh.rotation.set(Math.random()*Math.PI*2,Math.random()*Math.PI*2,Math.random()*Math.PI*2);
    mesh.userData.rot={x:(Math.random()-0.5)*0.006,y:(Math.random()-0.5)*0.007};
    mesh.userData.driftY=(Math.random()*0.006+0.002)*(Math.random()<0.5?1:-1);
    bgScene.add(mesh); shapes.push(mesh);
  }
  function resizeBg(){ bgRenderer.setSize(window.innerWidth,window.innerHeight); bgCam.aspect=window.innerWidth/window.innerHeight; bgCam.updateProjectionMatrix(); }
  window.addEventListener('resize',resizeBg);
  function animateBg(){
    requestAnimationFrame(animateBg);
    shapes.forEach(s=>{
      s.rotation.x+=s.userData.rot.x; s.rotation.y+=s.userData.rot.y;
      s.position.y+=s.userData.driftY;
      if(s.position.y>9) s.position.y=-9; if(s.position.y<-9) s.position.y=9;
    });
    bgCam.position.x = Math.sin(Date.now()*0.00007)*1.5;
    bgCam.lookAt(0,0,0);
    bgRenderer.render(bgScene,bgCam);
  }
  animateBg();
})();
// ---------- shared three.js ----------
let renderer, scene, camera, group, dragging=false, lastX=0, lastY=0, autoSpin=true;
function initThree(){
  const canvas=document.getElementById('stage');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45,1,0.1,100);
  camera.position.set(0,1.4,4.4);
  const light=new THREE.DirectionalLight(0xffffff,1.1); light.position.set(3,5,4); scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff,0.8));
  group=new THREE.Group(); group.rotation.x=-0.3; scene.add(group);
  resize(); window.addEventListener('resize',resize);
  canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.style.cursor='grabbing';});
  window.addEventListener('pointerup',()=>{dragging=false;canvas.style.cursor='grab';});
  window.addEventListener('pointermove',e=>{ if(!dragging)return; group.rotation.y+=(e.clientX-lastX)*0.012; lastX=e.clientX; lastY=e.clientY; });
  animate();
}
function resize(){ const canvas=document.getElementById('stage'); if(!canvas)return; const w=canvas.clientWidth||400,h=170; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
function animate(){ requestAnimationFrame(animate); if(group && autoSpin && !dragging) group.rotation.y+=0.006; renderer.render(scene,camera); }
function clearGroup(){ while(group.children.length){ const c=group.children.pop(); c.geometry&&c.geometry.dispose(); group.remove(c); } }

function buildCompassIcon(){
  clearGroup(); autoSpin=true;
  const legMat=new THREE.MeshStandardMaterial({color:0x374151});
  const legGeo=new THREE.CylinderGeometry(0.05,0.05,1.6,12);
  const leg1=new THREE.Mesh(legGeo,legMat); leg1.position.set(-0.25,0,0); leg1.rotation.z=0.35; group.add(leg1);
  const leg2=new THREE.Mesh(legGeo,new THREE.MeshStandardMaterial({color:0x9ca3af})); leg2.position.set(0.25,0,0); leg2.rotation.z=-0.35; group.add(leg2);
  const hinge=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,16), new THREE.MeshStandardMaterial({color:0x22c55e}));
  hinge.position.set(0,0.78,0); group.add(hinge);
  const tip=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.15,8), new THREE.MeshStandardMaterial({color:0xf97316}));
  tip.position.set(-0.62,-0.78,0); tip.rotation.z=0.35; group.add(tip);
}
function buildPointWedges(a,b,x){
  clearGroup(); autoSpin=true;
  const vals=[a,b,x]; const colors=[0x22c55e,0x0ea5e9,0xf97316];
  let start=-Math.PI/2;
  vals.forEach((v,i)=>{
    const angle=(v/360)*Math.PI*2;
    const geo=new THREE.CylinderGeometry(1.2,1.2,0.18,32,1,false,start,angle);
    const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:colors[i]}));
    group.add(mesh); start+=angle;
  });
}
function buildTriangleWedge(a,b,x){
  clearGroup(); autoSpin=true;
  // simple flat triangle extrusion with angle a,b at base, x at apex (schematic, not to exact scale)
  const shape=new THREE.Shape();
  shape.moveTo(-1.3,-0.7); shape.lineTo(1.3,-0.7); shape.lineTo(-0.2,1.1); shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{depth:0.16,bevelEnabled:false}); geo.center(); geo.rotateX(-Math.PI/2);
  const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x3b82f6,side:THREE.DoubleSide}));
  group.add(mesh);
}

// ---------- Construction Steps ----------
const constructions=[
 {task:"Draw the perpendicular BISECTOR of segment AB using compass and straightedge.",
  steps:[
   "Draw line segment AB.",
   "Open the compass to more than half of AB's length.",
   "With centre A, draw arcs above and below AB.",
   "With the same radius and centre B, draw arcs crossing the first arcs at two points.",
   "Join the two arc-intersection points with a straight line — this line bisects AB at 90°."]},
 {task:"Construct a PERPENDICULAR to line AB from a point P that lies ON the line.",
  steps:[
   "Draw line AB with point P marked on it.",
   "With centre P, draw arcs cutting AB at two points, X and Y, equidistant from P.",
   "Open the compass wider than PX and, with centre X, draw an arc above the line.",
   "With the same radius and centre Y, draw another arc crossing the first arc at point Q.",
   "Join P to Q — PQ is perpendicular to AB."]},
 {task:"Construct a PERPENDICULAR to line AB from a point P NOT on the line.",
  steps:[
   "Draw line AB and mark point P above it.",
   "With centre P, draw an arc that cuts AB at two points, X and Y.",
   "With centre X, draw an arc below AB (radius more than half XY).",
   "With the same radius and centre Y, draw another arc crossing the first at point Q.",
   "Join P to Q — the line PQ is perpendicular to AB."]},
 {task:"BISECT a given angle ∠ABC using compass and straightedge.",
  steps:[
   "With centre B (the vertex), draw an arc cutting both arms of the angle at points X and Y.",
   "With centre X, draw an arc inside the angle.",
   "With the same radius and centre Y, draw another arc crossing the first arc at point Z.",
   "Join B to Z — ray BZ bisects the angle into two equal halves."]},
 {task:"Construct a 60° angle at point A on ray AB (the building block for 30°, 90°, and 120°).",
  steps:[
   "Draw ray AB.",
   "With centre A and any convenient radius, draw an arc cutting AB at point X.",
   "With the same radius and centre X, draw another arc crossing the first arc at point Y.",
   "Join A to Y — angle YAB measures exactly 60°."]}
];
let ci=0, score=0, pool=[], picked=[];
function startSteps(){ ci=0; score=0; document.getElementById('hint').textContent='Drag to spin the 3D compass model'; buildCompassIcon(); renderStep(); }
function shuffled(arr){return arr.map((v,i)=>[v,i]).sort(()=>Math.random()-0.5).map(p=>p[0]);}
function renderStep(){
  const below=document.getElementById('below');
  if(ci>=constructions.length){
    below.innerHTML=`<div class="done"><h2>🏁 All constructions done!</h2><p>Score: <b>${score} / ${constructions.length}</b></p>
    <p style="color:var(--muted);font-size:.9rem;">Covers: perpendicular bisector, perpendiculars from a point on/off a line, angle bisection, constructing 60° (base for 30°,90°,105°,120°).</p>
    <button class="restart" onclick="startSteps()">Play Again</button></div>`;
    return;
  }
  const c=constructions[ci];
  pool = shuffled(c.steps); picked=[];
  below.innerHTML=`<div class="stats"><span>Task ${ci+1} of ${constructions.length}</span><span>Score: ${score}</span></div>
  <div class="task">${c.task}</div>
  <div class="label">Tap the steps in the correct order</div>
  <div class="pool" id="pool"></div>
  <div class="label">Your order</div>
  <div class="seq" id="seq"></div>
  <div class="btnRow"><button class="act reset" id="resetBtn">Reset</button></div>
  <div class="feedback" id="fb"></div>
  <button class="next" id="nextBtn">Next ▶</button>`;
  const poolEl=document.getElementById('pool');
  pool.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='step'; d.textContent=s; d.dataset.text=s;
    d.onclick=()=>{ if(d.classList.contains('picked'))return; d.classList.add('picked'); picked.push(s); renderSeq(); if(picked.length===c.steps.length) checkStep(c); };
    poolEl.appendChild(d);
  });
  document.getElementById('resetBtn').onclick=()=>renderStep();
}
function renderSeq(){
  const seqEl=document.getElementById('seq'); seqEl.innerHTML='';
  picked.forEach((s,i)=>{ const d=document.createElement('div'); d.className='seqItem'; d.textContent=`${i+1}. ${s}`; seqEl.appendChild(d); });
}
function checkStep(c){
  const right = picked.every((s,i)=>s===c.steps[i]);
  if(right){ score++; document.getElementById('fb').textContent='✅ Perfect order!'; document.getElementById('fb').style.color='var(--good)'; }
  else{ document.getElementById('fb').textContent='❌ Not quite the right order — correct sequence is shown below.'; document.getElementById('fb').style.color='var(--bad)';
    const seqEl=document.getElementById('seq'); seqEl.innerHTML=''; c.steps.forEach((s,i)=>{ const d=document.createElement('div'); d.className='seqItem'; d.style.borderColor='#dc2626'; d.textContent=`${i+1}. ${s}`; seqEl.appendChild(d); });
  }
  document.getElementById('nextBtn').style.display='inline-block';
}
document.addEventListener('click',e=>{ if(e.target && e.target.id==='nextBtn' && document.getElementById('tabSteps').classList.contains('active')){ ci++; renderStep(); }});

// ---------- Angle Sum Detective ----------
function genAngleQ(){
  const type=Math.random()<0.5?'point':'triangle';
  if(type==='point'){
    const a=Math.floor(20+Math.random()*100), b=Math.floor(20+Math.random()*100);
    const x=360-a-b;
    return {type, a,b, text:`Three angles meet at a point: ${a}°, ${b}°, and x°. What is x?`, correct:x};
  } else {
    const a=Math.floor(30+Math.random()*80), b=Math.floor(30+Math.random()*(150-a));
    const x=180-a-b;
    return {type, a,b, text:`In a triangle, two angles are ${a}° and ${b}°. What is the third angle x?`, correct:x};
  }
}
let aq=[], aqi=0, aScore=0;
function startAngles(){ aq=[genAngleQ(),genAngleQ(),genAngleQ(),genAngleQ(),genAngleQ()]; aqi=0; aScore=0; document.getElementById('hint').textContent='The 3D model shows the angles to scale — drag to spin'; renderAngle(); }
function renderAngle(){
  const below=document.getElementById('below');
  if(aqi>=aq.length){
    below.innerHTML=`<div class="done"><h2>🏁 Done!</h2><p>Score: <b>${aScore} / ${aq.length}</b></p>
    <p style="color:var(--muted);font-size:.9rem;">Covers: finding unknown angles about a point and in a triangle.</p>
    <button class="restart" onclick="startAngles()">Play Again</button></div>`;
    return;
  }
  const q=aq[aqi];
  if(q.type==='point') buildPointWedges(q.a,q.b,q.correct); else buildTriangleWedge(q.a,q.b,q.correct);
  below.innerHTML=`<div class="stats"><span>Question ${aqi+1} of ${aq.length}</span><span>Score: ${aScore}</span></div>
  <div class="task">${q.text}</div><div class="opts" id="opts"></div>
  <div class="feedback" id="fb"></div><button class="next" id="nextBtn2">Next ▶</button>`;
  const correct=q.correct;
  const set=new Set([correct]);
  while(set.size<4){ set.add(Math.max(1,correct+(Math.floor(Math.random()*7)-3)*3)); }
  const opts=Array.from(set).sort(()=>Math.random()-0.5);
  const optsEl=document.getElementById('opts');
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o+'°';
    b.onclick=()=>{
      document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      if(o===correct){ b.classList.add('correct'); aScore++; document.getElementById('fb').textContent='✅ Correct!'; document.getElementById('fb').style.color='var(--good)'; }
      else{ b.classList.add('wrong'); document.querySelectorAll('.opt').forEach(x=>{ if(x.textContent===correct+'°') x.classList.add('correct'); });
        document.getElementById('fb').textContent=`❌ Correct: ${correct}°`; document.getElementById('fb').style.color='var(--bad)'; }
      document.getElementById('nextBtn2').style.display='inline-block';
    };
    optsEl.appendChild(b);
  });
}
document.addEventListener('click',e=>{ if(e.target && e.target.id==='nextBtn2'){ aqi++; renderAngle(); }});

function switchMode(m){
  document.getElementById('tabSteps').classList.toggle('active',m==='steps');
  document.getElementById('tabAngles').classList.toggle('active',m==='angles');
  if(m==='steps') startSteps(); else startAngles();
}
document.getElementById('tabSteps').onclick=()=>switchMode('steps');
document.getElementById('tabAngles').onclick=()=>switchMode('angles');
initThree();
switchMode('steps');
</script>
</body>
</html>
